<script type="module">
import * as THREE from 'three';

// Far-wall sign.
const MEDIUM_HANDLE = '@utlamuka';

// Every frame opens its Medium article. `short` is what the canvas prints on the picture —

// Newest first, and staggered down the corridor rather than hung in facing pairs: you walk in

// you are never looking at two at once.
const M = 'https://medium.com/@utlamuka/';
const BLOGS = [
  { url:M+'from-marvel-movies-to-a-real-machine-tony-stark-never-had-one-ai-he-had-a-workshop-full-of-them-ca81a397e90a',

  { url:M+'building-the-future-of-virtual-try-on-how-appify-ai-is-shaping-the-next-era-of-fashion-tech-049671e10d4d',

    wall:'L', t:-4 },
  { url:M+'the-future-of-e-commerce-content-creation-using-ai-to-automate-product-descriptions-eb12455236d7',

    title:'The Future of E-Commerce Content Creation: Using AI to Automate Product Descriptions',

  { url:M+'from-data-to-insights-mastering-advanced-retrieval-augmented-generation-with-gpt-4o-and-langchain-0759f6aaec1a',
    short:'Advanced RAG with GPT-4o & LangChain',

    wall:'L', t:-12 },
];

const ROOM={ w:14, d:40, h:8 };
const HALF_W=ROOM.w/2, HALF_D=ROOM.d/2;
const BOUND={ x:HALF_W-2.0, z:HALF_D-1.6 };

const renderer=new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#ededed');
scene.fog=new THREE.Fog('#ededed',28,64);
const camera=new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0,4.5,HALF_D+5);

// ---------- lights (soft monochrome) ----------
scene.add(new THREE.HemisphereLight('#ffffff','#bcbcbc',1.0));
scene.add(new THREE.AmbientLight('#ffffff',0.5));
const key=new THREE.DirectionalLight('#ffffff',0.9);
key.position.set(5,14,8); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=1; key.shadow.camera.far=60; key.shadow.camera.left=-20; key.shadow.camera.right=20; key.shadow.camera.top=24; key.shadow.camera.bottom=-24;
key.shadow.bias=-0.0004; key.shadow.radius=4; scene.add(key);

// ---------- room (white B/W gallery, narrow hall) ----------
const matFloor=new THREE.MeshStandardMaterial({ color:'#f4f4f4', roughness:0.45, metalness:0.0 });
const matWall =new THREE.MeshStandardMaterial({ color:'#e7e7e7', roughness:0.95 });
const black   =new THREE.MeshStandardMaterial({ color:'#141414', roughness:0.55 });
const floor=new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w,ROOM.d), matFloor);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
function wall(w,x,z,ry){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,ROOM.h),matWall); m.position.set(x,ROOM.h/2,z); m.rotation.y=ry; m.receiveShadow=true; scene.add(m);
  const sk=new THREE.Mesh(new THREE.BoxGeometry(w,0.18,0.1),black); sk.position.set(x,0.09,z); sk.rotation.y=ry; scene.add(sk); }
wall(ROOM.w,0,-HALF_D,0); wall(ROOM.d,-HALF_W,0,Math.PI/2); wall(ROOM.d,HALF_W,0,-Math.PI/2);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w,ROOM.d), new THREE.MeshStandardMaterial({ color:'#f2f2f2', roughness:1 }));
ceil.rotation.x=Math.PI/2; ceil.position.y=ROOM.h; scene.add(ceil);
for(const zz of [-11,-2,7,15]){ const s=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.08,3.0), new THREE.MeshStandardMaterial({ color:'#fff', emissive:'#fff', emissiveIntensity:0.6 })); s.position.set(0,ROOM.h-0.1,zz); scene.add(s); }

// ---------- framed drawings (black frame + white mat + B/W scribble) ----------
function wrapText(ctx,t,x,y,mw,lh){ const w=t.split(' '); let l='',yy=y; for(const wd of w){ const test=l?l+' '+wd:wd; if(ctx.measureText(test).width>mw&&l){ctx.fillText(l,x,yy);l=wd;yy+=lh;}else l=test;} if(l)ctx.fillText(l,x,yy); }
function artTexture(blog,i){
  const c=document.createElement('canvas'); c.width=520; c.height=680; const x=c.getContext('2d');
  x.fillStyle='#f8f8f8'; x.fillRect(0,0,520,680);
  // dense pencil-scribble blob (grayscale), loosely centered
  x.lineWidth=1; x.lineCap='round';
  for(let s=0;s<1400;s++){
    const g=30+Math.floor(Math.random()*110); x.strokeStyle='rgba('+g+','+g+','+g+','+(0.10+Math.random()*0.28)+')';
    let px=260+(Math.random()-0.5)*230, py=300+(Math.random()-0.5)*300;
    x.beginPath(); x.moveTo(px,py);
    for(let k=0;k<3;k++){ px+=(Math.random()-0.5)*70; py+=(Math.random()-0.5)*70; x.lineTo(px,py); }
    x.stroke();
  }
  // No number on the picture — the title alone. It starts where the number used to sit, so
  // there is no gap above it and a long one has four lines before it runs off the canvas.
  x.fillStyle='#111'; x.textBaseline='top';
  x.font='400 34px "Josefin Sans",sans-serif';
  wrapText(x, blog.short, 34, 560, 452, 36);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
const paintings=[];
BLOGS.forEach((blog,i)=>{
  const g=new THREE.Group();
  const onL=blog.wall==='L'; const wx=onL?-HALF_W+0.1:HALF_W-0.1; const into=onL?1:-1;
  g.position.set(wx,4.0,blog.t); g.rotation.y=onL?Math.PI/2:-Math.PI/2;
  const frame=new THREE.Mesh(new THREE.BoxGeometry(4.0,5.0,0.22), black); frame.castShadow=true; g.add(frame);
  const mat=new THREE.Mesh(new THREE.PlaneGeometry(3.7,4.7), new THREE.MeshStandardMaterial({ color:'#fbfbfb', roughness:0.9 })); mat.position.z=0.12; g.add(mat);
  const art=new THREE.Mesh(new THREE.PlaneGeometry(3.0,4.0), new THREE.MeshStandardMaterial({ map:artTexture(blog,i), roughness:0.9 })); art.position.z=0.13; g.add(art);
  scene.add(g);

  // straight black viewing rail in front of the frame
  const rx=onL?-HALF_W+1.2:HALF_W-1.2;
  for(const zz of [blog.t-1.9,blog.t+1.9]){ const post=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,1.0,10),black); post.position.set(rx,0.5,zz); post.castShadow=true; scene.add(post); }
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,3.8,10),black); bar.position.set(rx,0.98,blog.t); bar.rotation.x=Math.PI/2; scene.add(bar);

  // viewing circle on the floor (step in → camera faces the painting)
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.92,1.02,44), new THREE.MeshBasicMaterial({ color:'#111', transparent:true, opacity:0.4, side:THREE.DoubleSide }));
  ring.rotation.x=-Math.PI/2; const sx=wx+into*2.9; ring.position.set(sx,0.02,blog.t); scene.add(ring);

  paintings.push({ ...blog, group:g, mesh:art, wx, into, ring,
    worldPos:new THREE.Vector3(onL?wx+0.4:wx-0.4,1,blog.t),
    spot:new THREE.Vector3(sx,0,blog.t), center:new THREE.Vector3(wx,3.9,blog.t) });
});

// ---------- Medium sign on the far wall (the one with no frames on it) ----------
function drawMediumBoard(c){
  const x=c.getContext('2d'); const W=c.width, H=c.height;
  x.clearRect(0,0,W,H); x.fillStyle='#fbfbfb'; x.fillRect(0,0,W,H);
  x.textAlign='center'; x.textBaseline='top'; x.fillStyle='#111';
  x.font='300 92px "Josefin Sans",sans-serif';
  x.fillText('Medium Blogs', W/2, 92);
  x.fillRect(W/2-150, 232, 300, 2);
  x.fillStyle='#8a8a8a'; x.font='300 40px "Josefin Sans",sans-serif';
  x.fillText('medium.com/'+MEDIUM_HANDLE, W/2, 268);
}
{
  const c=document.createElement('canvas'); c.width=1100; c.height=380;
  drawMediumBoard(c);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
  // canvas takes the webfont only once it has actually loaded — redraw when it has, or the
  // sign bakes in the fallback face
  document.fonts.ready.then(()=>{ drawMediumBoard(c); tex.needsUpdate=true; });
  const bw=7.0, bh=bw*380/1100;
  const g=new THREE.Group(); g.position.set(0,3.9,-HALF_D+0.1); scene.add(g);
  const frame=new THREE.Mesh(new THREE.BoxGeometry(bw+0.3,bh+0.3,0.18), black); frame.castShadow=true; g.add(frame);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(bw,bh), new THREE.MeshStandardMaterial({ map:tex, roughness:0.9 }));
  face.position.z=0.1; g.add(face);
}

// ==================================================================
//  CHARACTER — scribble-ball chibi: big round tangled-line head, small
//  body, stubby arms + legs. Solid black core + a halo of black scribble
//  strokes for the fuzzy pen-drawn silhouette. All black. Faces -z.
// ==================================================================
const inkBlack=new THREE.MeshBasicMaterial({ color:'#0c0c0c' });
const character=new THREE.Group(); const rig=new THREE.Group(); character.add(rig);
// solid cores
// chibi proportions, in head-diameters (head fuzz d = 0.81). Stacked feet-up: legs reach up
// to 0.26 but the torso hangs down to 0.227, so only 0.227 of leg is visible — the rest is
// buried. Torso height is what sets leg length here: drop the body and it swallows more leg,
// and the gap between them gets capped by the torso's curve rather than by its tapering
// bottom tip (which is the sharp crotch). Torso 0.227-0.633 (near-round, 0.39 x 0.40),
// head centre 1.00. Rig scaled 1.15.
// No neck: the head's lower hemisphere sinks INTO the torso. Head halo underside is at
// 1.00 - 0.405 = 0.595, torso top is 0.633, so it beds in by 0.04 — enough that the two
// read as one silhouette with no seam, not so much that the head looks swallowed.
const head=new THREE.Mesh(new THREE.SphereGeometry(0.355,20,18), inkBlack); head.position.y=1.00; rig.add(head);
// y-scale compensates the wider radius so the torso keeps its 0.227-0.633 span — plumper
// without pushing the top up into the head or the bottom down over the legs
const body=new THREE.Mesh(new THREE.SphereGeometry(0.235,18,16), inkBlack); body.geometry.scale(1,0.864,1); body.position.y=0.43; rig.add(body);
// scribble halo — SHORT CURLY strokes that wrap AROUND the surface (hug the
// silhouette like tangled hair/pen scribble), not straight radial spikes.
function scribbleHalo(cx,cy,cz,rad,count,squashY){
  const pts=[]; const C=new THREE.Vector3(cx,cy,cz);
  const up=new THREE.Vector3(0,1,0), alt=new THREE.Vector3(1,0,0);
  const n=new THREE.Vector3(), t1=new THREE.Vector3(), t2=new THREE.Vector3(), p=new THREE.Vector3(), q=new THREE.Vector3();
  for(let i=0;i<count;i++){
    const u=Math.random()*Math.PI*2, v=Math.acos(2*Math.random()-1);
    n.set(Math.sin(v)*Math.cos(u), Math.cos(v), Math.sin(v)*Math.sin(u));
    t1.copy(n).cross(Math.abs(n.y)>0.9?alt:up).normalize(); t2.copy(n).cross(t1).normalize();
    // Wide shell band + loose per-segment wander below. A narrow band (or pinning every
    // segment to one radius) turns the halo into a clean outline and the pen-scribble
    // look dies — the tangle comes from strokes crossing in and out of the surface.
    // The band is skewed INWARD (pow > 1): with a flat distribution, enough strokes land
    // near the outer limit to form random lumps and the silhouette goes out of round. Few
    // strokes reaching far out still reads as tangle; many does not.
    const shell=rad*(0.90+Math.pow(Math.random(),1.7)*0.22);
    p.copy(n).multiplyScalar(shell); p.y*=squashY; p.add(C);
    // step scales with the halo — a fixed step is a long straight run on a small limb and
    // a spike-forming stride on the head. Short steps curl tighter and keep the outline round.
    let ang=Math.random()*Math.PI*2; const segs=6+((Math.random()*5)|0), step=rad*(0.10+Math.random()*0.10);
    for(let k=0;k<segs;k++){
      ang += (Math.random()-0.5)*1.8;                       // curl
      q.copy(t1).multiplyScalar(Math.cos(ang)*step).addScaledVector(t2, Math.sin(ang)*step).add(p);
      // pull back onto the shell so the stroke travels along the surface. Measure in
      // UNSQUASHED space or the squash is undone after the first segment and every halo
      // collapses back to a ball.
      const d=q.clone().sub(C); d.y/=squashY; const dl=d.length()||1;
      d.multiplyScalar(shell*(0.92+Math.random()*0.14)/dl); d.y*=squashY; q.copy(C).add(d);
      pts.push(p.x,p.y,p.z, q.x,q.y,q.z); p.copy(q);
    }
  }
  const gg=new THREE.BufferGeometry(); gg.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  return new THREE.LineSegments(gg, new THREE.LineBasicMaterial({ color:'#0c0c0c', transparent:true, opacity:0.9 }));
}
// counts are high on purpose — sparse strokes leave the outline patchy on one side
rig.add(scribbleHalo(0,1.00,0,0.355,1600,1.0));  // head fuzz (outer edge ~0.40 -> bottom y0.595)
// body halo radius is UNDER the core's 0.235 on purpose. Strokes reach ~1.19x their halo
// radius, so a halo set at the core radius puts a thick ragged fringe outside the mesh and
// that fringe becomes the silhouette — which is what made the tummy look lopsided. At 0.215
// the fuzz peaks around 0.255, a thin fringe on a round edge the solid core still defines.
rig.add(scribbleHalo(0,0.43,0,0.215,1250,0.864)); // body fuzz
// stubby limbs (solid black) with a touch of fuzz. The fuzz is a SLEEVE down the whole
// limb (squashed to the capsule's aspect), not a ball at the midpoint — a ball there reads
// as an elbow / knee joint, which this character does not have.
function stub(len,r,flat){ const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,5,10), inkBlack); b.position.y=-len/2; g.add(b);
  const c=new THREE.Mesh(new THREE.SphereGeometry(r*1.15,10,10), inkBlack); if(flat)c.geometry.scale(1.3,0.7,1.5); c.position.y=-len; g.add(c);
  const rad=r*1.2; g.add(scribbleHalo(0,-len*0.5,0,rad,170,(len/2+r)/rad)); return g; }
// arms. Splay alone cannot open the armpit: the torso is a fat sphere (half-width 0.193 at
// its equator, y0.46) so an arm hanging off its upper surface stays buried until well below
// that, which pinches the gap into a thin triangle low on the body. So the arm shaft is
// pushed OUTBOARD of the equator (`out`) instead, and a shoulder cap bridges the resulting
// space at the joint — otherwise the arm floats free of the body. That puts the armpit apex
// at y~0.56 (cap underside) rather than y~0.39, and the notch runs nearly the torso's
// height. The splay lives on the pivot, so tick()'s .rotation.x swing stays pure front/back.
// `out` sets how DEEP the armpit cuts: bigger pushes the arm clear of the torso further up.
// Kept small here — a plump torso wants the arms hugging it, with the gap opening only near
// the hand. Clearing the torso's widest band (0.238 at y0.43) to open the gap all the way to
// the shoulder needs out ~0.11, and that reads as arms held out, not arms at rest.
function shoulder(x,splay){
  const out=Math.sign(x)*0.065;
  const s=new THREE.Group(); s.position.set(x,0.615,0); s.rotation.z=splay; rig.add(s);
  const a=stub(0.35,0.058,false); a.position.x=out; s.add(a);
  // cap lives on rig, not on the swinging arm — a shoulder should not swing with the arm.
  // Only has to span torso surface (0.080 at this height) to arm inner edge (0.155), so it
  // sits inboard and stays small; a bigger one just reads as bulk.
  const cx=Math.sign(x)*0.115;
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.055,12,12), inkBlack);
  cap.position.set(cx,0.615,0); rig.add(cap);
  rig.add(scribbleHalo(cx,0.615,0,0.062,75,1.0));
  return a; }
// sign matters: +z rotation swings -x outward is FALSE — it tucks the arm into the chest.
// Left shoulder needs -z, right needs +z, so both hands land at |x| 0.35.
const armL=shoulder(-0.135,-0.34);
const armR=shoulder( 0.135, 0.34);
// short stubby legs, stance wide enough to leave a clear gap between them
const legL=stub(0.26,0.062,true); legL.position.set(-0.09,0.26,0); rig.add(legL);
const legR=stub(0.26,0.062,true); legR.position.set( 0.09,0.26,0); rig.add(legR);
// eyes — two white tall ovals, floated just in front of the head fuzz (z<0, faces -z)
const eyeWhite=new THREE.MeshBasicMaterial({ color:'#fff' });
// bigger and set a touch lower on the face than the sculpture's — that reads as cute.
// Sizes are pre-divided by ~1.2: the eyes float 0.43 in front of a head 2.6 from the
// camera, so perspective magnifies them by that much on screen.
for(const ex of [-0.128,0.128]){
  const e=new THREE.Mesh(new THREE.CircleGeometry(1,20), eyeWhite);
  e.geometry.scale(0.054,0.078,1);
  // z must clear the head halo's OUTER reach (0.355 * 1.14 = 0.40), not the core radius,
  // or loose strokes draw across the whites. Don't overshoot either — the further the
  // eyes float, the more perspective inflates them.
  e.position.set(ex,0.920,-0.44); e.rotation.y=Math.PI; rig.add(e);
}

character.position.set(0,0,HALF_D-5); scene.add(character);
// overall size lives here, not in rig.scale — tick() overwrites rig.scale every frame for
// the idle breathing. Same reason the shadow is sized by its geometry, not .scale.
character.scale.setScalar(1.15);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.53,24), new THREE.MeshBasicMaterial({ color:'#000', transparent:true, opacity:0.16 }));
shadow.rotation.x=-Math.PI/2; shadow.position.y=0.02; scene.add(shadow);

// ---------- input ----------
const keys={}; const MOVE={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
addEventListener('keydown',e=>{ if(MOVE[e.code]){keys[MOVE[e.code]]=true;e.preventDefault();dismissHint();} if(e.code==='KeyE'&&active)go(active); });
addEventListener('keyup',e=>{ if(MOVE[e.code])keys[MOVE[e.code]]=false; });
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1; ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(paintings.map(p=>p.mesh))[0];
  if(hit){ const p=paintings.find(p=>p.mesh===hit.object); if(p&&character.position.distanceTo(p.worldPos)<14) go(p); return; }
  if(active) go(active);
});
function go(p){ window.open(p.url,'_blank','noopener'); }

const plabel=document.getElementById('plabel'), plabelT=document.getElementById('plabel-t');
const hintEl=document.getElementById('hint'); let hintTimer=setTimeout(dismissHint,7000);
function dismissHint(){ hintEl.classList.add('dim'); clearTimeout(hintTimer); }
let active=null;

// ---------- loop ----------
const vel=new THREE.Vector3(); const clock=new THREE.Clock(); let walkPhase=0;
const camLookAt=new THREE.Vector3(0,1.2,HALF_D-8); const cp=new THREE.Vector3(), cl=new THREE.Vector3();
const dist2D=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);

function tick(){
  const dt=Math.min(clock.getDelta(),0.05), nowT=performance.now();
  let ix=0,iz=0; if(keys.f)iz-=1; if(keys.b)iz+=1; if(keys.l)ix-=1; if(keys.r)ix+=1;
  const inLen=Math.hypot(ix,iz), SPEED=6.0;
  if(inLen>0){ ix/=inLen; iz/=inLen; vel.x+=(ix*SPEED-vel.x)*Math.min(1,dt*9); vel.z+=(iz*SPEED-vel.z)*Math.min(1,dt*9); }
  else { vel.x+=(0-vel.x)*Math.min(1,dt*11); vel.z+=(0-vel.z)*Math.min(1,dt*11); }
  character.position.x=THREE.MathUtils.clamp(character.position.x+vel.x*dt,-BOUND.x,BOUND.x);
  character.position.z=THREE.MathUtils.clamp(character.position.z+vel.z*dt,-BOUND.z,BOUND.z);
  const speed=Math.hypot(vel.x,vel.z), sf=Math.min(speed/5,1);

  // ---- viewing circle detection ----
  let inSpot=null; for(const p of paintings){ if(dist2D(character.position,p.spot)<1.15){ inSpot=p; break; } }
  paintings.forEach(p=>{ p.ring.material.opacity = (p===inSpot)?0.85:0.4; p.ring.scale.setScalar(p===inSpot?1.05:1); });

  // ---- facing ----
  if(inSpot && speed<0.8){
    const targetRot=inSpot.into*Math.PI/2;                 // turn to face the painting
    let d=targetRot-character.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); character.rotation.y+=d*Math.min(1,dt*6);
  } else if(speed>0.4){
    const tr=Math.atan2(-vel.x,-vel.z); let d=tr-character.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); character.rotation.y+=d*Math.min(1,dt*10);
  }

  // ---- walk / idle ----
  walkPhase+=speed*dt*2.6; const sw=Math.sin(walkPhase);
  legL.rotation.x= sw*0.8*sf; legR.rotation.x=-sw*0.8*sf;
  armL.rotation.x=-sw*0.7*sf; armR.rotation.x= sw*0.7*sf;
  const hop=Math.abs(sw)*0.022*sf; rig.position.y=hop;
  const st=sw*0.018*sf; rig.scale.set(1-st*0.6,1+st,1-st*0.6);
  if(sf<0.05){ const br=Math.sin(nowT*0.003)*0.03; rig.scale.set(1-br*0.5,1+br,1-br*0.5); rig.position.y=0; legL.rotation.x=legR.rotation.x=armL.rotation.x=armR.rotation.x=0; }
  shadow.position.set(character.position.x,0.02,character.position.z); shadow.scale.setScalar(1-hop*1.4);

  // ---- camera: follow, OR swing to face the painting when on a circle ----
  if(inSpot){ cp.set(inSpot.wx+inSpot.into*6.2, 2.6, inSpot.t); cl.copy(inSpot.center); }
  else { cp.set(character.position.x*0.5, 3.2, character.position.z+7); cl.set(character.position.x*0.7, 0.81, character.position.z-1.5); }
  camera.position.lerp(cp, Math.min(1,dt*(inSpot?2.2:3)));
  camLookAt.lerp(cl, Math.min(1,dt*(inSpot?2.2:3))); camera.lookAt(camLookAt);

  // ---- prompt ----
  if(inSpot!==active){ active=inSpot; if(active){ plabelT.textContent=active.title; plabel.classList.add('show'); } else plabel.classList.remove('show'); }

  renderer.render(scene,camera); requestAnimationFrame(tick);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

let pct=0; const pctEl=document.getElementById('pct');
const li=setInterval(()=>{ pct=Math.min(100,pct+Math.round(9+Math.random()*22)); pctEl.textContent=pct+'%'; if(pct>=100){ clearInterval(li); setTimeout(()=>document.getElementById('loader').classList.add('gone'),300);} },90);
renderer.render(scene,camera); requestAnimationFrame(tick);
</script>
</body>
</html>
